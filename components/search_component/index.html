<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 60px;
            background: transparent;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Arial, sans-serif;
        }

        .search-container {
            width: 100%;
            position: relative;
        }

        .search-wrapper {
            position: relative;
            width: 100%;
            height: 56px;
        }

        .search-input {
            width: 100%;
            height: 56px;
            padding: 0 52px 0 18px;
            border-radius: 12px;
            border: 1px solid #3f414a;
            outline: none;
            background: #26272e;
            color: #ffffff;
            font-size: 16px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .search-input::placeholder {
            color: #a7a7ad;
        }

        .search-input:focus {
            border-color: #e50914;
            box-shadow: 0 0 0 1px #e50914;
        }

        .search-button {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: #dddddd;
            font-size: 20px;
            cursor: pointer;
        }

        .search-button:hover {
            background: #3a3a3a;
        }

        .history {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 64px;
            background: #242424;
            border: 1px solid #3d3d3d;
            border-radius: 12px;
            overflow-y: auto;
            max-height: 288px;
            z-index: 10;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.55);
        }

        .history-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-height: 48px;
            padding: 8px 12px;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .history-item:hover {
            background: #3a3a3a;
        }

        .history-left {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex: 1;
        }

        .history-icon {
            flex-shrink: 0;
            color: #bbbbbb;
            font-size: 16px;
        }

        .history-text {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .remove-history {
            flex-shrink: 0;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #bbbbbb;
            font-size: 21px;
            cursor: pointer;
        }

        .remove-history:hover {
            background: #505050;
            color: #ffffff;
        }
    </style>
</head>

<body>
    <div class="search-container" id="searchContainer">

        <div class="search-wrapper">
            <input
                id="searchInput"
                class="search-input"
                type="text"
                autocomplete="off"
                placeholder="Search movies..."
                aria-label="Search movies"
            >

            <button
                id="searchButton"
                class="search-button"
                type="button"
                aria-label="Submit search"
                title="Search"
            >🔍</button>
        </div>

        <div
            id="history"
            class="history"
            role="listbox"
            aria-label="Recent searches"
        ></div>
    </div>

    <script>
        // ==================================================
        // STREAMLIT COMPONENT COMMUNICATION
        // ==================================================

        function sendMessageToStreamlit(type, data = {}) {
            const message = {
                isStreamlitMessage: true,
                type: type,
                ...data
            };

            window.parent.postMessage(message, "*");
        }

        function setFrameHeight(height) {
            sendMessageToStreamlit(
                "streamlit:setFrameHeight",
                { height: height }
            );
        }

        function sendValue(value) {
            sendMessageToStreamlit(
                "streamlit:setComponentValue",
                {
                    value: value,
                    dataType: "json"
                }
            );
        }

        function initializeComponent() {
            sendMessageToStreamlit(
                "streamlit:componentReady",
                { apiVersion: 1 }
            );

            setFrameHeight(60);
        }

        // ==================================================
        // ELEMENTS
        // ==================================================

        const input = document.getElementById("searchInput");
        const searchButton = document.getElementById("searchButton");
        const historyBox = document.getElementById("history");
        const searchContainer = document.getElementById("searchContainer");

        const STORAGE_KEY = "cinematch_search_history";
        const MAX_HISTORY = 20;
        const MAX_VISIBLE_ITEMS = 6;

        let history = [];
        let historyOpen = false;

        // ==================================================
        // LOAD SEARCH HISTORY
        // ==================================================

        function loadHistory() {
            try {
                const saved = JSON.parse(
                    localStorage.getItem(STORAGE_KEY) || "[]"
                );

                if (Array.isArray(saved)) {
                    history = saved
                        .filter(item => typeof item === "string")
                        .map(item => item.trim())
                        .filter(Boolean)
                        .slice(0, MAX_HISTORY);
                } else {
                    history = [];
                }
            } catch (error) {
                history = [];
            }
        }

        function persistHistory() {
            try {
                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(history)
                );
            } catch (error) {
                // Search remains usable if storage is unavailable.
            }
        }

        // ==================================================
        // SAVE SEARCH
        // ==================================================

        function saveHistory(value) {
            value = value.trim();

            if (!value) {
                return;
            }

            history = history.filter(
                item => item.toLowerCase() !== value.toLowerCase()
            );

            history.unshift(value);
            history = history.slice(0, MAX_HISTORY);

            persistHistory();
        }

        // ==================================================
        // CLOSE HISTORY
        // ==================================================

        function closeHistory() {
            historyOpen = false;
            historyBox.style.display = "none";
            setFrameHeight(60);
        }

        // ==================================================
        // RENDER HISTORY DROPDOWN
        // ==================================================

        function renderHistory() {
            historyBox.replaceChildren();

            if (!historyOpen) {
                closeHistory();
                return;
            }

            const searchTerm = input.value.trim().toLowerCase();

            const filteredHistory = history.filter(item =>
                item.toLowerCase().includes(searchTerm)
            );

            if (filteredHistory.length === 0) {
                closeHistory();
                return;
            }

            historyBox.style.display = "block";

            filteredHistory.forEach(item => {
                const row = document.createElement("div");
                row.className = "history-item";
                row.setAttribute("role", "option");

                const left = document.createElement("div");
                left.className = "history-left";

                const icon = document.createElement("span");
                icon.className = "history-icon";
                icon.textContent = "🕘";

                const text = document.createElement("span");
                text.className = "history-text";
                text.textContent = item;

                left.appendChild(icon);
                left.appendChild(text);

                const removeButton = document.createElement("button");
                removeButton.className = "remove-history";
                removeButton.type = "button";
                removeButton.textContent = "×";
                removeButton.title = "Remove from search history";
                removeButton.setAttribute(
                    "aria-label",
                    "Remove " + item + " from search history"
                );

                // Keep focus in the input while interacting with history.
                row.addEventListener("mousedown", event => {
                    event.preventDefault();
                });

                removeButton.addEventListener("click", event => {
                    event.stopPropagation();

                    history = history.filter(
                        entry => entry !== item
                    );

                    persistHistory();
                    renderHistory();
                });

                row.addEventListener("click", () => {
                    input.value = item;
                    submitSearch();
                });

                row.appendChild(left);
                row.appendChild(removeButton);
                historyBox.appendChild(row);
            });

            const visibleCount = Math.min(
                filteredHistory.length,
                MAX_VISIBLE_ITEMS
            );

            setFrameHeight(
                64 + visibleCount * 48 + 12
            );
        }

        // ==================================================
        // SUBMIT SEARCH
        // ==================================================

        function submitSearch() {
            const value = input.value.trim();

            if (!value) {
                return;
            }

            saveHistory(value);
            closeHistory();

            // Notify Python. Streamlit will rerun the app.
            sendValue(value);
        }

        // ==================================================
        // INPUT EVENTS
        // ==================================================

        input.addEventListener("focus", () => {
            historyOpen = true;
            renderHistory();
        });

        input.addEventListener("input", () => {
            historyOpen = true;
            renderHistory();
        });

        input.addEventListener("keydown", event => {
            if (event.key === "Enter") {
                event.preventDefault();
                submitSearch();
            }

            if (event.key === "Escape") {
                closeHistory();
            }
        });

        searchButton.addEventListener("mousedown", event => {
            event.preventDefault();
        });

        searchButton.addEventListener("click", submitSearch);

        input.addEventListener("blur", () => {
            // Delay closing so history selection can complete first.
            window.setTimeout(() => {
                if (!searchContainer.contains(document.activeElement)) {
                    closeHistory();
                }
            }, 150);
        });

        // ==================================================
        // STREAMLIT RENDER EVENTS
        // ==================================================

        window.addEventListener("message", event => {
            if (
                event.data &&
                event.data.type === "streamlit:render"
            ) {
                // The component does not need additional Python arguments.
                setFrameHeight(
                    historyOpen ? historyBox.offsetHeight + 76 : 60
                );
            }
        });

        // ==================================================
        // INITIALIZE
        // ==================================================

        loadHistory();
        initializeComponent();
    </script>
</body>
</html>
